
name: Update interview prep progress

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_progress.py
      - .github/workflows/progress.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-readme-progress
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate SVG progress bars and totals
        run: python3 scripts/update_progress.py

      - name: Create pull request for progress changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-progress
          base: main
          add-paths: |
            README.md
            assets/progress/
          commit-message: 'docs: refresh interview prep progress'
          title: 'docs: refresh interview prep progress'
          body: |
            Automatically refreshes completion totals and SVG progress bars
            based on the checkboxes in README.md.
          delete-branch: true
