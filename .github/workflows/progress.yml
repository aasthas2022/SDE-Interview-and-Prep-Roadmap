
name: Update interview prep progress

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/update_progress.py
      - .github/workflows/progress.yml

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-interview-prep-progress
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate progress bars and totals
        run: python3 scripts/update_progress.py

      - name: Commit generated progress changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/progress/

          if git diff --cached --quiet; then
            echo "No progress changes detected."
            exit 0
          fi

          git commit -m "docs: refresh interview prep progress [skip ci]"
          git push origin HEAD:main
